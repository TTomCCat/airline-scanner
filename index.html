<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f3a5f" />
    <meta name="description" content="Scan and save airline boarding passes — works offline." />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="Boarding Pass" />
    <title>Boarding Pass Reader</title>
    <script>
      // Apply the saved light/dark choice before first paint (no flash). Same key as src/lib/settings.js.
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('setting:theme')) || 'auto'; } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
